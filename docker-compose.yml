version: '3.8'

services:
  # Hardhat local blockchain
  hardhat:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    volumes:
      - ./:/app
      - hardhat-cache:/app/cache
      - hardhat-artifacts:/app/artifacts
    networks:
      - projecty-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4000
      - DATABASE_URL=file:./data/projecty.db
      - BLOCKCHAIN_RPC_URL=http://hardhat:8545
      - EVENT_POLL_INTERVAL_MS=5000
      - RECONCILE_INTERVAL_MS=60000
      - RECONCILER_AUTO_FIX=true
      - TX_WAIT_TIMEOUT_MS=120000
    volumes:
      - backend-data:/app/data
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - hardhat
    networks:
      - projecty-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - projecty-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  projecty-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  hardhat-cache:
    driver: local
  hardhat-artifacts:
    driver: local
