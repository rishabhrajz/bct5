name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install
      
      - name: Run ESLint (if configured)
        run: |
          cd backend && npm run lint --if-present
          cd ../frontend && npm run lint --if-present
        continue-on-error: true

  test-contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Compile contracts
        run: npx hardhat compile
      
      - name: Run contract tests
        run: npx hardhat test
      
      - name: Check contract size
        run: npx hardhat size-contracts || true

  test-backend:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm install
      
      - name: Install backend dependencies
        run: cd backend && npm install
      
      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
      
      - name: Start Hardhat node
        run: npx hardhat node --hostname 0.0.0.0 &
      
      - name: Wait for Hardhat
        run: sleep 10
      
      - name: Deploy contracts
        run: npx hardhat run contracts/scripts/deploy.js --network localhost
      
      - name: Setup test database
        run: |
          cd backend
          NODE_ENV=development npx prisma migrate deploy
      
      - name: Start backend
        run: cd backend && npm run dev &
      
      - name: Wait for backend
        run: sleep 15
      
      - name: Run event listener test
        run: node scripts/test-event-listener.js
      
      - name: Run reconciler test
        run: node scripts/test-reconciler.js
      
      - name: Check backend health
        run: curl -f http://localhost:4000/health || exit 1

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [test-contracts, test-backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: projecty-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: projecty-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-docker-compose:
    name: Test Docker Compose Deployment
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Create .env file
        run: cp .env.example .env
      
      - name: Start services
        run: docker-compose up -d
      
      - name: Wait for services
        run: sleep 30
      
      - name: Check backend health
        run: |
          curl -f http://localhost:4000/health || exit 1
          curl -f http://localhost:4000/health/readiness || exit 1
      
      - name: Check frontend
        run: curl -f http://localhost:3000/health || exit 1
      
      - name: Show logs on failure
        if: failure()
        run: docker-compose logs
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
          cd backend && npm audit --audit-level=moderate || true
          cd ../frontend && npm audit --audit-level=moderate || true
        continue-on-error: true

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [lint, test-contracts, test-backend, test-docker-compose]
    
    steps:
      - name: Success
        run: echo "✅ All CI/CD checks passed!"
